package: django.tar

---
profiles:
  - dev
  - tst
  - pre
  - prod

---
## Defaults
stages:

  pass-prepare:
    - rm -f django.tar
    - corepack enable pnpm
    - pnpm config set registry http://maven.xpaas.lenovo.com/nexus/repository/npm/
    - pnpm install

  prepare:
    - rm -f nodejs.tar.gz
    - pwd
    - export npm_config_sharp_libvips_local_prebuilds=.devops/sharp/vendor/
    - echo $npm_config_sharp_libvips_local_prebuilds
    - echo "export PATH=$(pwd)/.npm-global/bin:$PATH" > .npm-global/.profile
    - cat .npm-global/.profile
    - sh .npm-global/.profile
    - npm config set prefix '$(pwd)/.npm-global'
    - npm config get prefix
    - npm cache clean --force
    - yarn config set registry http://maven.xpaas.lenovo.com/nexus/repository/npm/
    - yarn
    - npm install --ignore-scripts --legacy-peer-deps

  build-dev:
    - echo "STRAPI_BASE_PATH=/ghcpsit" >> .env
    - cat .env
    - npm run build
  build:
    - pnpm run build
  build-us:
    - echo "STRAPI_BASE_PATH=/ghcpus" >> .env
    - cat .env
    - npm run build

  tar:
    - tar -cvf django.tar --exclude 'package.sh' --exclude '*.tar' --exclude .cache --exclude .tmp --exclude .git --exclude .github --exclude node_modules  *

  clean-node-modules:
    - npm cache clean --force
